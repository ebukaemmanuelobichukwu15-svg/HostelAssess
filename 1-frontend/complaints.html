<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complaints | HostelAssess</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header class="dashboard-header">
        <div class="logo">
            <div class="logo-icon"><img src="assets/images/logo-mark.svg" alt=""></div>
            <span>Hostel<span class="logo-highlight">Assess</span></span>
        </div>
        <div class="user-menu">
            <div class="user-avatar" data-user-initials>--</div>
            <div>
                <strong data-user-name>Loading...</strong>
                <small>Student</small>
            </div>
            <a href="login.html" data-logout>Logout</a>
        </div>
    </header>

    <div class="dashboard-layout">
        <aside class="sidebar">
            <a href="student-dashboard.html" class="sidebar-link">
                <span>▣</span> Dashboard
            </a>
            <a href="assessment.html" class="sidebar-link">
                <span>★</span> Assessment
            </a>
            <a href="complaints.html" class="sidebar-link active">
                <span>!</span> Complaints
            </a>
            <a href="profile.html" class="sidebar-link">
                <span>◉</span> Profile
            </a>
            <div class="sidebar-bottom">
                <a href="login.html" class="sidebar-link" data-logout>
                    <span>↪</span> Logout
                </a>
            </div>
        </aside>

        <main class="dashboard-main">
            <div class="dashboard-heading">
                <div>
                    <span class="form-label">COMPLAINTS</span>
                    <h1>Report a hostel problem</h1>
                    <p>Tell management about a problem that needs attention.</p>
                </div>
            </div>

            <div class="dashboard-grid">
                <div class="dashboard-card">
                    <div class="card-heading">
                        <div>
                            <span>NEW COMPLAINT</span>
                            <h3>Submit a complaint</h3>
                        </div>
                    </div>
                    <form id="complaintForm">
                        <div class="form-group">
                            <label for="category">Complaint Category</label>
                            <select id="category" name="category" required>
                                <option value="">Select category</option>
                                <option value="water-supply">Water Supply</option>
                                <option value="electricity">Electricity</option>
                                <option value="sanitation">Sanitation</option>
                                <option value="security">Security</option>
                                <option value="maintenance">Maintenance</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="description">Description</label>
                            <textarea id="description" name="description" rows="7" minlength="10" maxlength="1500" placeholder="Describe the problem..." required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Submit Complaint</button>
                    </form>
                </div>

                <div class="dashboard-card">
                    <div class="card-heading">
                        <div>
                            <span>MY COMPLAINTS</span>
                            <h3>Complaint history</h3>
                        </div>
                    </div>
                    <div data-complaint-history class="skeleton-card" aria-live="polite">Loading complaints...</div>
                </div>
            </div>
        </main>
    </div>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="assets/js/config.js"></script><script src="assets/js/api.js"></script><script src="assets/js/script.js"></script>
</body>
</html>
