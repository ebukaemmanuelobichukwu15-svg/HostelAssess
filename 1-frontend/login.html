<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | HostelAssess</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-brand">
            <a href="index.html" class="back-home">← Back to Home</a>
            <div class="auth-brand-content">
                <div class="logo-icon large"><img src="assets/images/logo-mark.svg" alt=""></div>
                <h1>Hostel<span>Assess</span></h1>
                <p>Online Hostel Service Assessment System</p>
            </div>
        </div>
        <div class="auth-form-container">
            <div class="auth-form">
                <span class="form-label">WELCOME BACK</span>
                <h2>Sign in to your account</h2>
                <p class="form-description">Enter your account details to continue.</p>
                <form id="loginForm" method="post" autocomplete="on">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="you@example.com" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required>
                    </div>
                    <div class="form-options">
                        <label class="checkbox-label">
                            <input type="checkbox" name="remember"> Remember me
                        </label>
                        <a href="#">Forgot password?</a>
                    </div>
                    <button type="submit" class="btn btn-primary full-btn">Sign In</button>
                </form>
                <div class="auth-divider">
                    <span>OR</span>
                </div>
                <p class="register-text">Don't have an account? <a href="register.html">Create one</a></p>
            </div>
        </div>
    </div>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/script.js"></script>
</body>
</html>
